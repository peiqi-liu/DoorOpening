hidden_dim: 256
type_dim: 8
dropout: 0.0

normalize_state: True
normalize_action: True
action_space: "absolute"
action_dim: 19
aux_weight: 0.1

door_pcd_num_points: 30000  # Dense scene-door sampling before local policy crops are taken.
local_pcd_range: [1.2, 0.25, 0.25]
x_direction_cutoff: -0.5

pcd_encoders_cfg:
  local_pcd_t:
    type: "pointnet"
    num_output_tokens: 128
    num_points: [6000, 2500, 0]  # Policy door input = base crop + palm crop; robot points are configured below.
    use_pcd: true

state_encoders_cfg:
  q_base:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_arm:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_hand:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  aux_handle_pos:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_base_t1:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_arm_t1:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_hand_t1:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_base_t5:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_arm_t5:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_action_hand_t5:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_base_t1:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_arm_t1:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_hand_t1:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_base_t5:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_arm_t5:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_hand_t5:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_base_t10:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_arm_t10:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  prev_q_hand_t10:
    input_dim: 9

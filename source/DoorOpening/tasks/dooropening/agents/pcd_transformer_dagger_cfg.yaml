transformer_cfg:
  type: "encoder_decoder"
  encoder_layers: 6
  decoder_layers: 6
  encoder_heads: 8
  decoder_heads: 8
  encoder_dim_feedforward: 1024
  decoder_dim_feedforward: 1024

dagger:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_iters: 250000
  teacher_forcing_warmup_iters: 5000
  teacher_forcing_transition_iters: 20000
  teacher_forcing_schedule: "linear"
  teacher_forcing_min_beta: 0.0
  aux_feedback_to_policy: true
  # aux_pregrasp_dropout_prob: 0.001  # Conservative start: 0.1% per pregrasp step while aux feedback is carried over.
  aux_pregrasp_dropout_prob: 0
  log_interval: 100
  save_interval: 5000
  reset_progress_total: 50000
  adr_reset_progress_total: 10000
  pointcloud_source: "lidar"
  robot_num_points: 30000
  sampler_render:
    inflate_px: 2
    jitter_std_m: 0.004
    clip_mode: "post"
    jitter_mode: "xyz"
    use_compile: true
  lidar_render:
    num_points: 10000
    num_azimuth: 1024
    num_polar: 256
    near_m: 0.1
    far_m: 30.0
    suppress_bins: 3
    occlusion_eps_m: 0.02
    occlusion_eps_rel: 0.01
    jitter_std_m: 0.0
    use_compile: true
  wall_distractors:
    enabled: true
    num_points: 30000
    resample_each_step: false  # Faster and more realistic than regenerating wall geometry every simulation step.
    side_margin_m: [0.35, 0.80]  # Absolute side coverage in meters so the wall can look wider regardless of door width.
    top_margin_scale: [0.10, 0.24]
    bottom_margin_scale: [0.02, 0.08]
    edge_gap_m: [0.015, 0.04]
    depth_m: [0.10, 0.3]  # Extra thickness beyond the door slab; a larger range gives thicker jambs/walls.
    center_offset_m: [-0.50, 0.50]  # Larger thickness-axis shifts produce deeper recessed and protruding layouts.
    side_margin_min_m: 0.10
    top_margin_min_m: 0.05
    face_jitter_m: 0.004
  viser:
    enabled: false  # Mode 1: stream the selected env live to Viser.
    update_interval: 1
    env_id: 0
    show_policy_input: true
    point_size: 0.004
    max_points: 8000
    serializer:
      enabled: false  # Mode 2: save `.viser` episode replays.
      path: "viser_replay.viser"
      frame_dt: 0.0333333333
    raw:
      enabled: false  # Mode 3: save raw `.pt` interval chunks, independent of live/serializer.
      path: "viser_replay.pt"
      save_interval: 5000  # Write one raw `.pt` file every N iterations.
      max_points: 5000
      max_frames: 2000  # Keep at most this many frames in each raw `.pt` file; set 0 to disable the cap.
  # Legacy `dagger.viser.record.*` keys are still accepted, but `serializer` + `raw` are the preferred split.
  wandb:
    enabled: false

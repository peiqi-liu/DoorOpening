hidden_dim: 256
type_dim: 8
dropout: 0.0

normalize_state: True
normalize_action: True
action_space: "absolute"
action_dim: 23
aux_weight: 0.1
mode_prediction:
  enabled: false
  num_modes: 2  # Push/pull discriminator only.
  weight: 0.01
  return_latent: true
force_prediction:
  enabled: false
  output_dim: 3
  weight: 0.01

push_pull_condition:
  enabled: true
  source: oracle
  obs_key: push_pull_cond
  detach_predicted_condition: true
  input_dim: 2
  hidden_dims: [64, 256]
  dropout: 0.0
  use_layer_norm: true

scene_door_num_points: 30000  # GT door/model points cached in the scene before any sensor rendering.
local_pcd_range: [1.2, 0.25, 0.25]
x_direction_cutoff: -0.5

temporal_obs:
  history_s: 1.0
  obs_delay_s: [0.0, 0.0]
  command_delay_s: [0.0, 0.0]

temporal_state_encoders:
  enabled: true
  timestamps_ms: [0, 300, 600, 900]
  # timestamps_ms: [0, 400, 800, 1200, 1600, 2000, 2400, 2800]
  fields:
    - q_arm
    - q_arx
    - q_hand
    - target_err_arm
    - push_pull_belief
    - target_err_hand
    - base_vel
    - aux_handle_pos
  hidden_dims: [128, 256]
  output_dim: 256
  activation: elu
  dropout: 0.0
  use_layer_norm: true
  add_field_type_embedding: true
  add_time_embedding: true

push_pull_condition_perturb:
  enabled: false
  probability: 0.1
  wrong_class_confidence_range: [0.85, 0.95]

observation_lag:
  enabled: true
  max_jitter_ms: 150
  mode: symmetric
  apply_to_proprio: true
  apply_to_pointcloud: false
  per_env: true
  per_timestamp: true
  clamp_to_available_history: true

pcd_encoders_cfg:
  local_pcd_t:
    type: "pointnet"
    num_output_tokens: 128
    num_points: [2500, 1000, 0]  # Policy crop counts for the fused depth+lidar observation; robot model points are configured below.
    use_pcd: true

state_encoders_cfg:
  q_arm:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_hand:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_arx:
    input_dim: 4
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  aux_handle_pos:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  push_pull_cond:
    input_dim: 2
    hidden_dims: [64, 256]
    dropout: 0.0
    use_layer_norm: true
    use_state: true
  base_vel:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  target_err_arm:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  target_err_hand:
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  target_err_arx:
    input_dim: 4
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true

transformer_cfg:
  type: "encoder_decoder"
  encoder_layers: 6
  decoder_layers: 6
  encoder_heads: 8
  decoder_heads: 8
  encoder_dim_feedforward: 1024
  decoder_dim_feedforward: 1024

dagger:
  learning_rate: 2.0e-4
  lr_schedule: cosine
  min_learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_iters: 250000
  lr_decay_iters: 80000
  teacher_forcing_warmup_iters: 2000
  teacher_forcing_transition_iters: 18000
  teacher_forcing_min_beta: 0.0
  aux_feedback_to_policy: true  # When false, aux input stays zero instead of feeding back predictions.
  prediction_training:
    loss_window_start: 40
    loss_window_end: 100
    outside_window_weight: 0.25
  force_training:
    sensor_name: "contact_forces_door2"
    target_frame: "base"  # Predict forces in robot-base coordinates so the target matches the policy's main reference frame.
    loss_type: "direction_contrastive"
    contrastive_temperature: 0.1
  door_geometry_aug:
    enabled: false
    env_prob: 1.0
    global_shift_std_m: [0.010, 0.010, 0.005]
    global_shift_clip_m: [0.025, 0.025, 0.010]
    handle_child_shift_std_m: [0.000, 0.012, 0.012]
    handle_child_shift_clip_m: [0.000, 0.030, 0.030]
    handle_scale_range: [0.97, 1.03]
    panel_width_scale_range: [0.98, 1.02]
    panel_width_axis: 1
    panel_width_anchor: "origin"
  log_interval: 100
  save_interval: 5000
  reset_progress_total: 50000
  adr_reset_progress_total: 10000
  pointcloud_source: "both"
  scene_robot_num_points: 30000  # GT robot/model points concatenated into the renderable scene cloud.
  append_robot_model_to_policy_cloud: true
  robot_model_policy_points: 2000  # Robot model points appended to the policy input after the depth/lidar crops.
  robot_pointcloud_filter:
    enabled: true
    sdf_cutoff: 0.02
    max_points_per_process: 5000
  depth_cam_render:
    num_points: 12000
    inflate_px: 2
    jitter_std_m: 0.01
    clip_mode: "post"
    jitter_mode: "xyz"
    use_compile: true
  lidar_render:
    num_points: 12000
    num_azimuth: 128
    num_polar: 256
    near_m: 0.1
    far_m: 30.0
    suppress_bins: 2
    occlusion_eps_m: 0.02
    occlusion_eps_rel: 0.01
    jitter_std_m: 0.01
    use_compile: true
  wall_distractors:
    enabled: true
    wall_num_points: 40000
    # The sampler builds two vertical "wall columns" beside the door panel in the door-panel local frame:
    # - width axis: left/right across the panel, so the columns sit just outside the panel edges
    # - height axis: bottom/top of the panel
    # - thickness axis: through the panel, normal to the door slab
    # Each sampled point comes from either the left or right column.
    side_margin_m: [0.2, 1.20]  # Column width along the door width axis, i.e. how far each column extends outward from the left/right panel edge.
    edge_gap_m: [-0.05, 0.3]  # Empty gap between the panel side edge and the inner face of the wall column.
    depth_m: [0.7, 1.5]  # Extra thickness added beyond the door slab thickness along the door-thickness axis.
    center_offset_m: [-0.80, 0.80]  # Shift of the whole column along the door-thickness axis: negative is recessed behind the slab center, positive protrudes in front.
    # Wall height follows the door panel bbox height in the ordered door-local height axis.
    face_jitter_m: 0.1  # Small noise added only on the snapped outer faces so the walls do not look perfectly planar.
  viser:
    raw:
      enabled: false  # Save raw `.pt` replay chunks for offline debugging.
      path: "viser_replay.pt"
      capture_interval: 2  # Save one frame, skip one frame, so each replay chunk spans more rollout time.
      save_interval: 10000  # Write one raw `.pt` file every N iterations.
      max_points: 6000  # Raw replay is for debugging, not training; smaller clouds replay much better on laptops.
      max_frames: 2000  # Keep at most this many frames in each raw `.pt` file; set 0 to disable the cap.
  wandb:
    enabled: false

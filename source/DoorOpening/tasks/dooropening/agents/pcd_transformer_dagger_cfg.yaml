hidden_dim: 256
type_dim: 8
dropout: 0.0

normalize_state: True
normalize_action: True
action_space: "absolute"
action_dim: 22
aux_weight: 0.1
mode_prediction:
  enabled: false
  num_modes: 2  # Push/pull discriminator only.
  weight: 0.01
  return_latent: true
door_joint_prediction:
  enabled: true
  output_dim: 2  # Must equal the number of dagger.door_joint_training.joints below.
  weight: 0.01

push_pull_condition:
  enabled: true
  source: oracle
  obs_key: push_pull_cond
  detach_predicted_condition: true
  input_dim: 2
  hidden_dims: [64, 256]
  dropout: 0.0
  use_layer_norm: true

left_right_condition:
  # Additive oracle one-hot for handle side (left/right), independent of push/pull. Oracle only
  # (no predicted source) and no temporal history input. Flip enabled to true to turn it on; it
  # auto-creates its own state encoder under obs_key from the hidden_dims below.
  enabled: true
  obs_key: left_right_cond
  input_dim: 2
  hidden_dims: [64, 256]
  dropout: 0.0
  use_layer_norm: true

scene_door_num_points: 30000  # GT door/model points cached in the scene before any sensor rendering.
local_pcd_range: [1.2, 0.25, 0.25]
x_direction_cutoff: -0.5

temporal_obs:
  history_s: 1.0
  obs_delay_s: [0.0, 0.0]
  command_delay_s: [0.0, 0.0]

temporal_state_encoders:
  enabled: true
  timestamps_ms: [0, 300, 600, 900]
  # timestamps_ms: [0, 400, 800, 1200, 1600, 2000, 2400, 2800]
  fields:
    - q_arm
    # - q_hand
    # - target_err_arm
    # - push_pull_belief
    # - target_err_hand
    # - base_vel
    # - aux_handle_pos
    # aux_handle_pos is intentionally NOT in the temporal stack: it is a standalone, recurrent
    # handle-pose input seeded from ground truth on reset (see dagger.aux_handle_input_mode).
  hidden_dims: [128, 256]
  output_dim: 256
  activation: elu
  dropout: 0.0
  use_layer_norm: true
  add_field_type_embedding: true
  add_time_embedding: true

push_pull_condition_perturb:
  enabled: false
  probability: 0.1
  wrong_class_confidence_range: [0.85, 0.95]

observation_lag:
  enabled: true
  max_jitter_ms: 150
  mode: symmetric
  apply_to_proprio: true
  apply_to_pointcloud: false
  per_env: true
  per_timestamp: true
  clamp_to_available_history: true

pcd_encoders_cfg:
  local_pcd_t:
    type: "pointnet"
    num_output_tokens: 32
    num_points: [2500, 0, 0]  # Policy crop counts [base_crop, palm_crop, (robot slot)]. For pointcloud_source="both" each crop is split evenly across realsense+lidar (e.g. 2500 -> 1250 realsense + 1250 lidar). Robot model points are configured below.
    use_pcd: true

state_encoders_cfg:
  q_arm:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_hand:
    input_dim: 12
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  aux_handle_pos:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  push_pull_cond:
    input_dim: 2
    hidden_dims: [64, 256]
    dropout: 0.0
    use_layer_norm: true
    use_state: true
  base_vel:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  # target_err_arm:
  #   input_dim: 7
  #   hidden_dims: [128, 256]
  #   dropout: 0.0
  #   use_state: true
  # target_err_hand:
  #   input_dim: 12
  #   hidden_dims: [128, 256]
  #   dropout: 0.0
  #   use_state: true

transformer_cfg:
  type: "encoder_decoder"
  encoder_layers: 6
  decoder_layers: 6
  encoder_heads: 8
  decoder_heads: 8
  encoder_dim_feedforward: 1024
  decoder_dim_feedforward: 1024

dagger:
  learning_rate: 2.0e-4
  lr_schedule: cosine
  min_learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_iters: 250000
  lr_decay_iters: 80000
  teacher_forcing_warmup_iters: 2000
  teacher_forcing_transition_iters: 18000
  teacher_forcing_min_beta: 0.0
  # Aux handle input mode:
  #   "recurrent"        -> policy input = previous step's aux prediction (fed back). The first step
  #                         after each reset is seeded from aux_handle_init_source below; predictions
  #                         take over from step 1.
  #   "closed_door_base" -> policy input = the closed-door (door joint=0) handle pose, expressed in
  #                         the CURRENT robot base frame, + fresh per-step noise. Non-recurrent.
  aux_handle_input_mode: recurrent
  aux_feedback_to_policy: true  # Recurrent feedback: previous step's aux prediction is fed back as the next-step input.
  aux_handle_init_source: ground_truth  # First-step seed: feed the (noised/biased) sim handle pose only on the first step after each reset. Requires aux_feedback_to_policy: true.
  # Two-term detector-error model on the aux handle pose (input only, never the aux target beyond what
  # the bias bakes in). Both are redrawn/added to EVERY aux input the policy sees (reset seed + the
  # recurrent fed-back prediction).
  # BIAS: per-episode constant offset baked into the ground-truth handle (feeds target + seed together)
  # so it PERSISTS all episode -- a real systematic per-door offset (off downward on one door, up/left
  # on another). Sampled as a CUBE: each of x/y/z independently uniform in [-this, +this] (per-dim
  # threshold in m, NOT a ball). 0.0 disables it.
  aux_handle_gt_bias_m: 1.0
  # NOISE: fresh per-step isotropic (ball) jitter, random direction x magnitude in [0, this] (m), added
  # to every aux input -- frame-to-frame detector noise. 0.0 disables it.
  aux_handle_noise_m: 0.1
  prediction_training:
    loss_window_start: 40
    loss_window_end: 100
    outside_window_weight: 0.25
  door_joint_training:
    # Door joints the aux head regresses, in output order. "hinge" = joint_2 (door swing angle),
    # "latch" = joint_1 (handle/latch rotation). Targets are the raw joint angles in radians.
    joints: ["hinge", "latch"]
    loss_type: "mse"  # 'mse' or 'smooth_l1' regression on the raw joint angles (rad).
  door_geometry_aug:
    enabled: false
    env_prob: 1.0
    global_shift_std_m: [0.010, 0.010, 0.005]
    global_shift_clip_m: [0.025, 0.025, 0.010]
    handle_child_shift_std_m: [0.000, 0.012, 0.012]
    handle_child_shift_clip_m: [0.000, 0.030, 0.030]
    handle_scale_range: [0.97, 1.03]
    panel_width_scale_range: [0.98, 1.02]
    panel_width_axis: 1
    panel_width_anchor: "origin"
  log_interval: 100
  save_interval: 5000
  reset_progress_total: 50000
  adr_reset_progress_total: 10000
  pointcloud_source: "depth"
  # "measured" (default): base_vel obs is the sensed base joint velocity (matches deploy's fused
  # odometry). "commanded": base_vel obs is the student's own last commanded base action instead,
  # clamped to [-1, 1] in robot frame (normalized, not scaled by base_action_scale) -- avoids odom
  # noise/frame-convention issues but loses stall/slip feedback.
  # MUST match door_policy.yaml's policy.base_vel_source on the deploy side; this is a trained input.
  base_vel_source: "measured"
  scene_robot_num_points: 30000  # GT robot/model points concatenated into the renderable scene cloud.
  append_robot_model_to_policy_cloud: true
  robot_model_policy_points: 2000  # Robot model points appended to the policy input after the depth/lidar crops.
  robot_pointcloud_filter:
    enabled: true
    sdf_cutoff: 0.02
    max_points_per_process: 5000
  depth_cam_render:
    # Clean geometric depth round-trip (3D points -> 2D z-buffer depth image -> 3D points), rendered by
    # render_depth_roundtrip_from_pose. NO sensor-noise augmentation (depth jitter / spatial blur were
    # removed) -- only the z-buffer, the occluder anti-penetration pass, and near/far clipping remain.
    num_points: 12000
    inflate_px: 0  # Main-pass z-buffer dilation (px). 0 = plain round-trip (each point -> one pixel -> back), which is what we want; the door/robot clouds are dense enough that the raw per-pixel z-buffer has no meaningful holes. Raise to 1-2 only if the surface looks holey/sparse.
    clip_mode: "post"
    use_compile: true
    # Door panel + wall distractor points are rasterized a second time with this much larger dilation
    # and composited into the depth via a per-pixel min. At close range (near_m below) a sparse occluder
    # leaves per-pixel z-buffer gaps that let farther points (background, the far side of the wall) show
    # through; this second pass seals them so the walls render as solid boxes. 0 disables the pass. Tune
    # against the viser point-cloud replay: raise if rays still visibly punch through the wall/door,
    # lower if occluder silhouettes look too blocky.
    occluder_inflate_px: 5  # Anti-penetration dilation of the door/wall occluder (px). Was 10 (too blocky) -> 3 (~0.2% leaked, too much) -> 5 (0% penetration, far less blocky than 10). This only dilates occluder EDGES, so interior surfaces stay sharp. Raise toward 6 if rays leak at closer standoffs; lower toward 4 (~0.01%) for slightly sharper edges.
  lidar_render:
    num_points: 9000
    num_azimuth: 128
    num_polar: 256
    near_m: 0.1
    far_m: 30.0
    suppress_bins: 2
    occlusion_eps_m: 0.02
    occlusion_eps_rel: 0.01
    jitter_std_m: 0.01
    use_compile: true
    # Lidar analog of depth_cam_render.occluder_inflate_px (bin radius, not pixels). 0 disables it.
    occluder_fill_bins: 3
  wall_distractors:
    enabled: true
    wall_num_points: 50000
    # The sampler builds two vertical "wall columns" beside the door panel in the door-panel local frame:
    # - width axis: left/right across the panel, so the columns sit just outside the panel edges
    # - height axis: bottom/top of the panel
    # - thickness axis: through the panel, normal to the door slab
    # Each sampled point comes from either the left or right column.
    side_margin_m: [0.2, 0.8]  # Column width along the door width axis, i.e. how far each column extends outward from the left/right panel edge.
    edge_gap_m: [0.0, 0.04]  # Empty gap (m) between the door side edge and the inner face of the wall column. Non-zero so the wall never sits flush against / overlapping the door (a zero gap is unrealistic). Clamped to >= 0 in code.
    depth_m: [0.1, 1.5]  # Extra thickness added beyond the door slab thickness along the door-thickness axis, independently per front/back segment.
    # Position of the seam where the front and back segments on one side butt together (see
    # sample_seam), relative to the door's mid-thickness plane. Pinned to 0 so all 4 walls start
    # exactly at the door plane; kept as a config key (rather than removed) so sample_seam/
    # rand_range don't need a special zero-width-range code path.
    center_offset_m: [-0.25, 0.25]
    # Wall vertical extent. Every wall starts at the lower bound (0.25); the UPPER bound is randomized
    # INDEPENDENTLY per wall (each of the four columns draws its own top in [lower, upper]), so the
    # walls reach different heights. Lower stays below the policy's z-crop [0.55, 1.5] so coverage
    # never runs out at the bottom of the crop. Remove this key to fall back to the legacy behavior of
    # exactly matching the door panel's own bbox height.
    height_range_m: [0.25, 2.10]
    # Wall GT point count = total wall surface area * this density (points/m^2), capped at
    # wall_num_points. Keeps point density roughly constant as walls change size (esp. with the
    # randomized height above), instead of always emitting a fixed wall_num_points. Remove for the
    # legacy fixed-count behavior.
    point_density_per_m2: 3000
    face_jitter_m: 0.1  # Small noise added only on the snapped outer faces so the walls do not look perfectly planar.
  door_hole_aug:
    enabled: true # When enabled, drop points from link_1 to simulate a window/open hole in the door panel.
    env_prob: 0.35
    width_range_m: [0.12, 1.60]
    height_range_m: [0.18, 2.20]
    center_height_range_m: [0.10, 1.90]
    side_margin_range_m: [0.0, 0.18]
    surface_eps_m: 0.03
  viser:
    raw:
      enabled: false  # Save raw `.pt` replay chunks for offline debugging.
      path: "viser_replay.pt"
      capture_interval: 2  # Save one frame, skip one frame, so each replay chunk spans more rollout time.
      save_interval: 10000  # Write one raw `.pt` file every N iterations.
      max_points: 6000  # Raw replay is for debugging, not training; smaller clouds replay much better on laptops.
      max_frames: 2000  # Keep at most this many frames in each raw `.pt` file; set 0 to disable the cap.
  wandb:
    enabled: false

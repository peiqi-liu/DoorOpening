hidden_dim: 256
type_dim: 8
dropout: 0.0

normalize_state: True
normalize_action: True
# The environment interprets these normalized 11-D outputs as incremental commands: base channels
# are velocities, while arm/gripper channels integrate into PD targets each dt. This model-side
# decoder must pass the predicted command through unchanged; delta/relative would additionally
# combine it with current_angles before the environment applies its own integration.
action_space: "absolute"
action_dim: 11  # Match teacher/environment: base(3) + Franka arm(7) + gripper(1).
aux_weight: 0.1
mode_prediction:
  enabled: false
  num_modes: 2  # Push/pull discriminator only.
  weight: 0.01
  return_latent: true
door_joint_prediction:
  enabled: true
  # Diagnostic head only: its loss updates the readout, not the policy/action network.
  input_source: detached_action
  output_dim: 2  # Must equal the number of dagger.door_joint_training.joints below.
  weight: 0.01
rollout_progress_prediction:
  # Removed for proprioception-only distillation; rollout progress is not a policy signal.
  enabled: false
  weight: 0.0

push_pull_condition:
  # TEMPORARILY OFF: single-family distillation (PartNetv5_plusplus is 100% pull), so this one-hot
  # is a constant and carries no information. Set back to true when training on mixed push+pull
  # families. Disabling it also drops the `push_pull_cond` state encoder below (the model pops that
  # entry when this block is present and disabled), so nothing else needs changing here.
  enabled: false
  source: oracle
  obs_key: push_pull_cond
  detach_predicted_condition: true
  input_dim: 2
  hidden_dims: [64, 128]
  dropout: 0.0
  use_layer_norm: true

left_right_condition:
  # Additive oracle one-hot for handle side (left/right), independent of push/pull. Oracle only
  # (no predicted source) and no temporal history input. Flip enabled to true to turn it on; it
  # auto-creates its own state encoder under obs_key from the hidden_dims below.
  # TEMPORARILY OFF: PartNetv5_plusplus is 100% left-handle ('min'), so this one-hot is constant.
  # Set back to true when training on families that mix handle sides.
  enabled: false
  obs_key: left_right_cond
  input_dim: 2
  hidden_dims: [64, 128]
  dropout: 0.0
  use_layer_norm: true

scene_door_num_points: 60000  # GT door/model points cached in the scene before any sensor rendering.
# Crop radii in meters: [base, robot palm, auxiliary handle estimate].
local_pcd_range: [1.2, 0.25, 0.25]
pcd_height_range_m: [0.55, 1.2]  # Keep points between these world-frame heights before local cropping.
x_direction_cutoff: -0.5

temporal_obs:
  history_s: 1.0
  obs_delay_s: [0.0, 0.0]
  command_delay_s: [0.0, 0.0]

temporal_state_encoders:
  enabled: false
  timestamps_ms: [0, 300, 600, 900]
  # timestamps_ms: [0, 400, 800, 1200, 1600, 2000, 2400, 2800]
  fields:
    - q_arm
    - base_vel
    # - push_pull_belief
    # - target_err_hand
    # - base_vel
    # aux_handle_pos is intentionally NOT in the temporal stack: it is a standalone, recurrent
    # handle-pose input seeded from ground truth on reset (see dagger.aux_handle_input_mode).
  hidden_dims: [128, 256]
  output_dim: 256
  activation: elu
  dropout: 0.0
  use_layer_norm: true
  add_field_type_embedding: true
  add_time_embedding: true

push_pull_condition_perturb:
  enabled: false
  probability: 0.1
  wrong_class_confidence_range: [0.85, 0.95]

observation_lag:
  enabled: true
  max_jitter_ms: 150
  mode: symmetric
  apply_to_proprio: true
  apply_to_pointcloud: false
  per_env: true
  per_timestamp: true
  clamp_to_available_history: true

pcd_encoders_cfg:
  local_pcd_t:
    type: pointnet
    num_output_tokens: 128
    # Point budgets: [base crop, palm crop, auxiliary-handle-centered crop]. Robot model
    # points are appended separately using dagger.robot_model_policy_points.
    num_points: [2500, 0, 0]
    use_pcd: true

state_encoders_cfg:
  q_arm:
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  q_hand:
    # The gripper opening: ONE prismatic DOF (env cfg finger_joints), not the LEAP hand's 12.
    # Must equal len(env._robot_finger_dof_idx) -- the dagger feeds exactly those columns.
    # OFF: fixed_open_gripper pins the fingers at GRIPPER_OPEN_WIDTH, so this channel is a constant.
    input_dim: 1
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: false
  aux_handle_pos:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  keyframe_pose_base:
    # Optional keyframe/anchor pose input (panda_link4 position + 6D orientation).
    # Retained for reference only; disabled in this temporary run.
    # panda_link4: position 3 + 6D orientation.
    body_names: [panda_link4]
    input_dim: 9
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: false
  push_pull_cond:
    # Optional push/pull condition encoder; retained for reference only and disabled below.
    input_dim: 2
    hidden_dims: [64, 256]
    dropout: 0.0
    use_layer_norm: true
    use_state: false
  base_vel:
    input_dim: 3
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  target_err_arm:
    # Current-step Franka tracking error (PD target - measured joint angle), 7 DOF. No temporal
    # suffix, so it is sampled at this step only. Must equal len(env._robot_arm_dof_idx).
    input_dim: 7
    hidden_dims: [128, 256]
    dropout: 0.0
    use_state: true
  # target_err_hand:
  #   input_dim: 1  # gripper opening error (one DOF)
  #   hidden_dims: [128, 256]
  #   dropout: 0.0
  #   use_state: true

transformer_cfg:
  type: "encoder_decoder"
  encoder_layers: 6
  decoder_layers: 6
  encoder_heads: 8
  decoder_heads: 8
  encoder_dim_feedforward: 1024
  decoder_dim_feedforward: 1024

dagger:
  learning_rate: 1.5e-4
  lr_schedule: cosine
  min_learning_rate: 1.5e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_iters: 240000
  lr_decay_iters: 70000
  teacher_forcing_warmup_iters: 5000
  teacher_forcing_transition_iters: 20000
  teacher_forcing_min_beta: 0.0
  # Aux handle input mode:
  #   "recurrent"        -> policy input = previous step's aux prediction (fed back). The first step
  #                         after each reset is seeded from aux_handle_init_source below; predictions
  #                         take over from step 1.
  #   "closed_door_base" -> policy input = the closed-door (door joint=0) handle pose, expressed in
  #                         the CURRENT robot base frame, + fresh per-step noise. Non-recurrent.
  aux_handle_input_mode: recurrent
  aux_feedback_to_policy: true  # Recurrent feedback: previous step's aux prediction is fed back as the next-step input.
  aux_handle_init_source: ground_truth  # First-step seed: feed the (noised/biased) sim handle pose only on the first step after each reset. Requires aux_feedback_to_policy: true.
  # Two-term detector-error model on the aux handle pose (input only, never the aux target beyond what
  # the bias bakes in). Both are redrawn/added to EVERY aux input the policy sees (reset seed + the
  # recurrent fed-back prediction).
  # BIAS: per-episode constant offset baked into the ground-truth handle (feeds target + seed together)
  # so it PERSISTS all episode -- a real systematic per-door offset (off downward on one door, up/left
  # on another). Sampled as a CUBE: each of x/y/z independently uniform in [-this, +this] (per-dim
  # threshold in m, NOT a ball). 0.0 disables it.
  aux_handle_gt_bias_m: 0.0
  # NOISE: fresh per-step isotropic (ball) jitter, random direction x magnitude in [0, this] (m), added
  # to every aux input -- frame-to-frame detector noise. 0.0 disables it.
  aux_handle_noise_m: 0.05
  door_joint_training:
    # Door joints the aux head regresses, in output order. "hinge" = joint_2 (door swing angle),
    # "latch" = joint_1 (handle/latch rotation). Targets are the raw joint angles in radians.
    joints: ["hinge", "latch"]
    loss_type: "mse"  # 'mse' or 'smooth_l1' regression on the raw joint angles (rad).
  log_interval: 100
  save_interval: 5000
  reset_progress_total: 20000
  adr_reset_progress_total: 5000
  pointcloud_source: "depth"
  # "measured" (default): base_vel obs is the sensed base joint velocity (matches deploy's fused
  # odometry). "commanded": base_vel obs is the student's own last commanded base action instead,
  # clamped to [-1, 1] in robot frame (normalized, not scaled by base_action_scale) -- avoids odom
  # noise/frame-convention issues but loses stall/slip feedback.
  # MUST match door_policy.yaml's policy.base_vel_source on the deploy side; this is a trained input.
  base_vel_source: "measured"
  scene_robot_num_points: 60000  # GT robot/model points concatenated into the renderable scene cloud.
  append_robot_model_to_policy_cloud: false
  robot_model_policy_points: 0  # Do not append synthetic robot-model points to the policy cloud.
  robot_pointcloud_filter:
    # Robot self-points are stripped from the LIDAR cloud only. The depth camera is a real sensor that
    # sees the robot's own hand, so the depth cloud keeps its self-points (see _sample_scene_obs_pointcloud_base).
    # Filtering is always enabled in Python; this block only configures its distance cutoff and chunk size.
    sdf_cutoff: 0.02
    max_points_per_process: 5000
  depth_cam_render:
    # Match scripts/tools/render_depth_roundtrip_viser.py: concatenate door, walls, and robot,
    # rasterize one shared z-buffer, min-pool depth, drop edges/jitter, then back-project.
    num_points: 19200
    width_px: 160
    height_px: 120
    # Depth-camera field of view (degrees). Omit / null -> D435 physical defaults (85 x 58). Lowering
    # fov_y_deg narrows the VERTICAL angle at the same resolution, cropping top/bottom points to match a
    # real camera that effectively sees less vertically than 58 deg. Set to reduce the vertical FOV;
    # keep the deploy-time real camera crop (scripts/rl_games/play.py) in sync if this helps sim2real.
    fov_y_deg: 58  # Match the D435 nominal vertical field of view.
    inflate_px: 0
    clip_mode: "post"
    use_compile: true
    # Triton accelerates depth z-buffer projection; other rendering stages are unchanged.
    use_triton: true
    # Values shared with the Viser mock's depth_cfg processing path.
    blur_kernel_px: 5
    # Axial noise is applied to all finite pixels after the combined-depth blur and edge drop.
    axial_jitter_std_m: 0.005
    # Drop pixels across depth discontinuities after blur, before axial jitter.
    edge_drop_m: 0.01
    # Preserve thin handles as in the Viser preview: render link_2 separately from the background min filter.
    handle_layer:
      enabled: true
      inflate_px: 0
      occlusion_inflate_px: 0
  lidar_render:
    num_points: 9000
    num_azimuth: 128
    num_polar: 256
    near_m: 0.1
    far_m: 30.0
    suppress_bins: 2
    occlusion_eps_m: 0.02
    occlusion_eps_rel: 0.01
    jitter_std_m: 0.01
    use_compile: true
    # Lidar analog of depth_cam_render.occluder_inflate_px (bin radius, not pixels). 0 disables it.
    occluder_fill_bins: 3
  # Handle-visibility dropout: the protruding handle points are removed from the rendered door cloud, so
  # the panel reads flat and the aux head must keep tracking the handle from the visible panel + seed.
  # This is a BACKUP skill only -- reading the handle straight out of the point cloud stays the primary
  # objective -- so the hidden fraction is kept moderate (~19% of episodes at these settings).
  wall_distractors:
    enabled: true
    wall_num_points: 150000
    # The sampler builds two vertical "wall columns" beside the door panel in the door-panel local frame:
    # - width axis: left/right across the panel, so the columns sit just outside the panel edges
    # - height axis: bottom/top of the panel
    # - thickness axis: through the panel, normal to the door slab
    # Each sampled point comes from either the left or right column.
    side_margin_m: [0.2, 1.2]  # Column width along the door width axis, i.e. how far each column extends outward from the left/right panel edge. Upper bound raised from 0.8 -> 1.2 because the reworked x5 camera pose (mount pitch 0 deg, tilt now carried by x5_joint2/3) sees a wider band beside the door: at 0.8 m the column often ended inside the frame, leaving an unrealistic floating wall edge.
    edge_gap_m: [0.0, 0.04]  # Empty gap (m) between the door side edge and the inner face of the wall column, used ONLY on envs with no flush wall (see detached_within_flush_frac below for the flush case). Non-zero so the wall never sits flush against / overlapping the door (a zero gap is unrealistic). Clamped to >= 0 in code.
    detached_within_flush_frac: [0.0, 1.0]  # On envs with a flush wall, the box column sits at (flush's own sampled extent * this fraction) from the panel edge instead of edge_gap_m -- a DETACHED wall that interrupts the flush drywall somewhere WITHIN its own span (flush hasn't visually finished when the box shows up), which is what a robot actually sights to judge its base rotation, rather than a jamb wall hugging the door OR a wall that only appears after flush's full run. 0 = right at the panel edge (start of the flush run); 1 = right at the flush wall's own far edge.
    depth_m: [0.1, 1.5]  # Extra thickness added beyond the door slab thickness along the door-thickness axis, independently per front/back segment.
    # Position of the seam where the front and back segments on one side butt together (see
    # sample_seam), relative to the door's mid-thickness plane. Pinned to 0 so all 4 walls start
    # exactly at the door plane; kept as a config key (rather than removed) so sample_seam/
    # rand_range don't need a special zero-width-range code path.
    center_offset_m: [-0.25, 0.25]
    flush_depth_offset_prob: 0.5  # Each of the 4 box columns independently shifts away from the flush plane with this probability.
    flush_depth_gap_m: [0.4, 0.8]  # Per-column nearest-face offset from the flush-wall center; face jitter can reduce the visible gap by up to 0.1 m.
    # BOX side-wall vertical extent [bottom, max-top] (m). Each box draws its own top in [bottom, max-top].
    # Kept LOW on purpose: with the policy z-crop [0.55, 1.5], a box whose top < 0.55 vanishes from the
    # policy input entirely, so many boxes are "not there" after processing while others (top up to 1.8)
    # still fill the whole crop height. Remove this key to fall back to matching the door panel's bbox height.
    height_range_m: [0.1, 1.8]
    # Wall GT point count = total wall surface area * this density (points/m^2), capped at
    # wall_num_points. Keeps point density roughly constant as walls change size (esp. with the
    # randomized height above), instead of always emitting a fixed wall_num_points. Remove for the
    # legacy fixed-count behavior.
    point_density_per_m2: 9000
    face_jitter_m: 0.1  # Small noise added only on the snapped outer faces so the walls do not look perfectly planar.
    # --- Flush mounting wall (coexists with the box walls above) ---
    # A thin slab coplanar with the door panel, flanking it left+right and running floor-to-above-door --
    # the flat drywall surface a door sits flush in (the common case, but not the only one -- keep this
    # below 1.0 so the fully-open/glass-frame envs, with no wall context at all, still occur). The box
    # columns above are what vary the FAR-wall placement (see detached_within_flush_frac) on top of this.
    flush_prob: 0.9
    flush_point_fraction: 0.5   # Share of the wall point budget reserved for the flush wall (when present).
    # Flush slab thickness range (m). null -> match the door panel's own thickness exactly (both faces coplanar).
    flush_thickness_m: null
    flush_extent_m: [0.6, 1.6]  # How far the flat surface spreads outward from each panel side edge (m).
    flush_height_range_m: null  # [bottom, top] of the flat wall; null -> floor to just above the door top.
  # Door-frame (link_0 casing/jamb) augmentation. The frame is fused into the door base and is normally
  # ABSENT from the point cloud (only panel+handle are rendered). When enabled, each episode randomly
  # includes or drops the frame per env (domain randomization for the often-thick PartNetv5_plusplus
  # casings). Disabled by default -- set enabled: true to activate.
  door_frame_aug:
    enabled: true  # Real doors mostly DO have a visible casing/jamb, so the frame must appear in the input.
    env_prob: 0.65  # Per-env probability the frame IS rendered this episode. The remainder covers frameless / flush-mounted doors.
  door_hole_aug:
    # Per-rollout door appearance is drawn once at reset from these two probabilities. With
    # env_prob = P(hole) and glass_reflection.prob = P(reflection | hole), the three MUTUALLY
    # EXCLUSIVE cases are (logged live as door_hole_aug/{no_hole,pure_hole,reflection}_fraction):
    #   solid door           : 1 - env_prob                       = 0.55
    #   pure hole (bright)    : env_prob * (1 - reflection.prob)   = 0.135  <- transparent glass, no veil
    #   reflective glass (dark): env_prob * reflection.prob        = 0.315  <- hole + reflection blob
    # Keep reflection.prob < 1 so the pure-hole (bright) case always occurs.
    enabled: true # When enabled, drop points from link_1 to simulate a window/open hole in the door panel.
    env_prob: 0.45 # P(this rollout's door has a window hole).
    width_range_m: [0.12, 1.60]
    height_range_m: [0.18, 2.20]
    center_height_range_m: [0.10, 1.90]
    side_margin_range_m: [0.0, 0.18]
    surface_eps_m: 0.03
    resample_each_step: false # false: draw ONE hole per rollout at reset, fixed for the whole episode. true: redraw every step (old behaviour).
    glass_reflection:
      enabled: true # When on, a fraction of hole envs show a robot-SIZED noise blob behind the window (dark-glass reflection stand-in; a rough robot copy, not a true mirror image).
      prob: 0.7 # P(reflection | hole). < 1 leaves the rest as bright pure holes.
      num_points: 400 # Points in the reflection blob.
      blob_size_m: [0.5, 1.2, 0.3] # FULL robot-sized noise cluster (width, height, depth) -- compact, NOT a fill of the whole opening.
      size_fraction_range: [0.3, 1.0] # Each blob dim is independently scaled by a fraction in this range, so the reflection ranges from a small/thin sliver (just an arm) up to the full robot. Placed at a random spot inside the window.
      num_lobes: 3 # Number of overlapping Gaussian sub-clumps making up the cluster; more = lumpier / less box-like (1 = a single soft blob).
      behind_range_m: [0.1, 0.6] # The blob centre sits this far (m) behind the panel back face (away from the camera), where a virtual mirror image would be. Kept moderate so the reflection sits clearly behind the glass (not embedded in the door plane) while staying inside the local_pcd_range crop instead of being pushed too far back and cropped off.
      density_range: [0.3, 1.0] # Per-env fraction of num_points actually kept: low = faint (brighter), high = dense (darker). [1.0, 1.0] = always full.
  viser:
    raw:
      enabled: true  # Save raw `.pt` replay chunks for offline debugging.
      path: "viser_replay.pt"
      initial_capture_frames: 200  # First real training frames; flush this first chunk immediately.
      initial_capture_interval: 1  # Capture every training iteration during the initial chunk.
      capture_interval: 2  # Save one frame, skip one frame, so each replay chunk spans more rollout time.
      save_interval: 1000  # Fallback cadence when max_frames is disabled.
      max_points: 12000  # Match the configured policy point-cloud budget.
      max_frames: 2000  # Keep at most this many frames in each raw `.pt` file; set 0 to disable the cap.
  wandb:
    enabled: true
    project: dooropeningv22-distill
    entity: peiqiliu
    name: vision5_depth2500_no_robot_400gpu_fresh_20261014
